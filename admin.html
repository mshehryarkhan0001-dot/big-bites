<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Big Bites — Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #17110c;

            color: #fff3de;

        }


        header {

            background: #201811;

            border-bottom:
                2px solid #f5b301;

            padding: 20px 30px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

        }


        .logo {

            font-size: 28px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        .logo span {

            color: #e8432d;

        }


        .refresh-btn {

            background: #f5b301;

            color: #241a0c;

            border: none;

            padding: 12px 20px;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;

        }


        .refresh-btn:hover {

            background: #d99400;

        }


        .container {

            max-width: 1200px;

            margin: 40px auto;

            padding: 0 20px;

        }


        h1 {

            margin-bottom: 8px;

        }


        .subtitle {

            color: #cabfa9;

            margin-bottom: 30px;

        }


        /* STATS */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }


        .stat-card {

            background: #201811;

            border:
                1px solid
                rgba(255,243,222,.12);

            padding: 22px;

            border-radius: 8px;

        }


        .stat-card h3 {

            margin: 0 0 10px;

            color: #cabfa9;

        }


        .stat-card strong {

            font-size: 32px;

            color: #f5b301;

        }


        /* ORDERS */

        #ordersContainer {

            display: grid;

            gap: 20px;

        }


        .order-card {

            background: #201811;

            border:
                1px solid
                rgba(255,243,222,.12);

            border-left:
                5px solid #f5b301;

            border-radius: 8px;

            padding: 24px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.3);

        }


        .order-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

            flex-wrap: wrap;

        }


        .order-id {

            color: #f5b301;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .status {

            padding: 7px 12px;

            border-radius: 20px;

            background: #f5b301;

            color: #241a0c;

            font-weight: bold;

            font-size: 13px;

        }


        .order-info {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

            margin-bottom: 20px;

        }


        .info-box {

            background: #17110c;

            padding: 14px;

            border-radius: 5px;

        }


        .info-box small {

            display: block;

            color: #cabfa9;

            margin-bottom: 5px;

        }


        .info-box strong {

            color: #fff3de;

        }


        /* TOTAL */

        .total-box {

            background: #f5b301;

            color: #241a0c;

            padding: 18px;

            border-radius: 6px;

            margin-top: 10px;

            margin-bottom: 20px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            font-weight: bold;

            font-size: 20px;

        }


        .buttons {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .btn {

            border: none;

            padding: 10px 15px;

            border-radius: 4px;

            cursor: pointer;

            font-weight: bold;

        }


        .btn:hover {

            opacity: .85;

        }


        .accept {

            background: #6fae45;

            color: white;

        }


        .preparing {

            background: #f5b301;

            color: #241a0c;

        }


        .delivered {

            background: #4c8fd8;

            color: white;

        }


        .bill {

            background: #8c63d9;

            color: white;

        }


        .delete {

            background: #e8432d;

            color: white;

        }


        .empty {

            text-align: center;

            padding: 60px 20px;

            background: #201811;

            border-radius: 8px;

            color: #cabfa9;

        }


        .loading {

            text-align: center;

            padding: 40px;

            color: #f5b301;

        }


        .error {

            background: #3a1712;

            border:
                1px solid #e8432d;

            color: #ff9a8d;

            padding: 20px;

            border-radius: 8px;

            text-align: center;

        }


        /* BILL */

        .bill-modal {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.8);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;

        }


        .bill-modal.show {

            display: flex;

        }


        .bill-box {

            background: white;

            color: #222;

            width:
                min(500px,100%);

            max-height: 90vh;

            overflow: auto;

            padding: 30px;

            border-radius: 8px;

        }


        .bill-title {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .bill-subtitle {

            text-align: center;

            margin-bottom: 25px;

            color: #666;

        }


        .bill-line {

            border-top:
                1px dashed #999;

            margin: 15px 0;

        }


        .bill-row {

            display: flex;

            justify-content:
                space-between;

            gap: 15px;

            margin: 10px 0;

        }


        .bill-total {

            font-size: 22px;

            font-weight: bold;

            margin-top: 15px;

        }


        .bill-close {

            width: 100%;

            padding: 12px;

            margin-top: 20px;

            border: none;

            background: #e8432d;

            color: white;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;

        }


        .print-btn {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            background: #f5b301;

            color: #241a0c;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;

        }


        @media print {

            body * {

                visibility: hidden;

            }


            .bill-box,
            .bill-box * {

                visibility: visible;

            }


            .bill-box {

                position: absolute;

                left: 0;

                top: 0;

                width: 100%;

                box-shadow: none;

            }


            .bill-close,
            .print-btn {

                display: none;

            }

        }


        @media (max-width: 700px) {

            header {

                padding: 16px;

            }


            .logo {

                font-size: 22px;

            }


            .stats {

                grid-template-columns: 1fr;

            }


            .order-info {

                grid-template-columns: 1fr;

            }


            .container {

                margin-top: 25px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        BIG
        <span>●</span>
        BITES

    </div>


    <button
        class="refresh-btn"
        onclick="loadOrders()">

        🔄 Refresh Orders

    </button>

</header>



<div class="container">


    <h1>
        Order Dashboard
    </h1>


    <p class="subtitle">

        Manage all Big Bites customer orders

    </p>


    <!-- STATS -->

    <div class="stats">


        <div class="stat-card">

            <h3>
                Total Orders
            </h3>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                New Orders
            </h3>

            <strong id="newOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Delivered
            </h3>

            <strong id="deliveredOrders">
                0
            </strong>

        </div>

    </div>



    <div id="ordersContainer">

        <div class="loading">

            Loading orders...

        </div>

    </div>


</div>



<!-- BILL MODAL -->

<div
    class="bill-modal"
    id="billModal">


    <div
        class="bill-box"
        id="billContent">

    </div>

</div>



<script>


    // ==========================
    // LOAD ORDERS
    // ==========================

    async function loadOrders() {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        container.innerHTML =
            `<div class="loading">
                Loading orders...
            </div>`;


        try {

            const response =
                await fetch(
                    "/api/orders"
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load orders"
                );

            }


            const orders =
                await response.json();


            displayOrders(orders);


        } catch (error) {

            console.error(error);


            container.innerHTML =
                `<div class="error">

                    ❌ Could not load orders.

                    <br><br>

                    Make sure Node.js server
                    is running.

                </div>`;

        }

    }



    // ==========================
    // DISPLAY ORDERS
    // ==========================

    function displayOrders(orders) {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        document.getElementById(
            "totalOrders"
        ).textContent =
            orders.length;


        document.getElementById(
            "newOrders"
        ).textContent =
            orders.filter(
                order =>
                    order.status === "New"
            ).length;


        document.getElementById(
            "deliveredOrders"
        ).textContent =
            orders.filter(
                order =>
                    order.status === "Delivered"
            ).length;


        if (orders.length === 0) {

            container.innerHTML =
                `<div class="empty">

                    <h2>
                        📭 No Orders Yet
                    </h2>

                    <p>
                        Customer orders will appear here.
                    </p>

                </div>`;

            return;

        }


        container.innerHTML = "";


        orders
            .slice()
            .reverse()
            .forEach(order => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-header">

                        <div>

                            <div class="order-id">

                                ORDER #${order.id}

                            </div>

                            <div>

                                ${order.date}

                            </div>

                        </div>


                        <div class="status">

                            ${order.status}

                        </div>

                    </div>


                    <div class="order-info">


                        <div class="info-box">

                            <small>
                                👤 Customer
                            </small>

                            <strong>
                                ${order.customer}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                📞 Phone
                            </small>

                            <strong>
                                ${order.phone}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                🍔 Item
                            </small>

                            <strong>
                                ${order.item}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                🔢 Quantity
                            </small>

                            <strong>
                                ${order.quantity}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                💵 Unit Price
                            </small>

                            <strong>
                                Rs. ${order.price}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                📍 Address
                            </small>

                            <strong>
                                ${order.address}
                            </strong>

                        </div>


                    </div>


                    <div class="total-box">

                        <span>
                            TOTAL BILL
                        </span>

                        <span>
                            Rs. ${order.total}
                        </span>

                    </div>


                    ${
                        order.notes
                        ?
                        `
                        <div class="info-box">

                            <small>
                                📝 Extra Notes
                            </small>

                            <strong>
                                ${order.notes}
                            </strong>

                        </div>
                        `
                        :
                        ""
                    }


                    <div class="buttons">


                        <button
                            class="btn accept"
                            onclick="
                                updateStatus(
                                    ${order.id},
                                    'Accepted'
                                )
                            ">

                            ✅ Accept

                        </button>


                        <button
                            class="btn preparing"
                            onclick="
                                updateStatus(
                                    ${order.id},
                                    'Preparing'
                                )
                            ">

                            🍳 Preparing

                        </button>


                        <button
                            class="btn delivered"
                            onclick="
                                updateStatus(
                                    ${order.id},
                                    'Delivered'
                                )
                            ">

                            🚚 Delivered

                        </button>


                        <button
                            class="btn bill"
                            onclick="
                                showBill(
                                    ${order.id}
                                )
                            ">

                            🧾 View Bill

                        </button>


                        <button
                            class="btn delete"
                            onclick="
                                deleteOrder(
                                    ${order.id}
                                )
                            ">

                            🗑 Delete

                        </button>


                    </div>

                `;


                container.appendChild(
                    card
                );

            });

    }



    // ==========================
    // UPDATE STATUS
    // ==========================

    async function updateStatus(
        id,
        status
    ) {

        try {

            const response =
                await fetch(
                    `/api/orders/${id}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({
                                status: status
                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message
                );

            }


            loadOrders();


        } catch (error) {

            alert(
                "❌ " +
                error.message
            );

        }

    }



    // ==========================
    // DELETE ORDER
    // ==========================

    async function deleteOrder(id) {

        if (
            !confirm(
                "Are you sure you want to delete this order?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/orders/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message
                );

            }


            loadOrders();


        } catch (error) {

            alert(
                "❌ " +
                error.message
            );

        }

    }



    // ==========================
    // SHOW BILL
    // ==========================

    async function showBill(id) {

        try {

            const response =
                await fetch(
                    "/api/orders"
                );


            const orders =
                await response.json();


            const order =
                orders.find(
                    o => o.id === id
                );


            if (!order) {

                alert(
                    "Order not found"
                );

                return;

            }


            const billModal =
                document.getElementById(
                    "billModal"
                );


            const billContent =
                document.getElementById(
                    "billContent"
                );


            billContent.innerHTML = `

                <div class="bill-title">

                    BIG BITES

                </div>


                <div class="bill-subtitle">

                    ORDER INVOICE

                </div>


                <div class="bill-line"></div>


                <div class="bill-row">

                    <span>
                        Order #
                    </span>

                    <strong>
                        ${order.id}
                    </strong>

                </div>


                <div class="bill-row">

                    <span>
                        Date
                    </span>

                    <strong>
                        ${order.date}
                    </strong>

                </div>


                <div class="bill-line"></div>


                <div class="bill-row">

                    <span>
                        Customer
                    </span>

                    <strong>
                        ${order.customer}
                    </strong>

                </div>


                <div class="bill-row">

                    <span>
                        Phone
                    </span>

                    <strong>
                        ${order.phone}
                    </strong>

                </div>


                <div class="bill-row">

                    <span>
                        Address
                    </span>

                    <strong>
                        ${order.address}
                    </strong>

                </div>


                <div class="bill-line"></div>


                <div class="bill-row">

                    <span>
                        ${order.item}
                        × ${order.quantity}
                    </span>

                    <strong>
                        Rs. ${order.total}
                    </strong>

                </div>


                <div class="bill-line"></div>


                <div class="bill-row bill-total">

                    <span>
                        TOTAL
                    </span>

                    <span>
                        Rs. ${order.total}
                    </span>

                </div>


                ${
                    order.notes
                    ?
                    `
                    <div class="bill-line"></div>

                    <p>
                        <strong>
                            Notes:
                        </strong>

                        ${order.notes}
                    </p>
                    `
                    :
                    ""
                }


                <div class="bill-line"></div>


                <p style="
                    text-align:center;
                    margin-top:20px;
                ">

                    Thank you for ordering
                    from Big Bites! 🍔

                </p>


                <button
                    class="print-btn"
                    onclick="window.print()">

                    🖨 Print Bill

                </button>


                <button
                    class="bill-close"
                    onclick="closeBill()">

                    Close

                </button>

            `;


            billModal.classList.add(
                "show"
            );


        } catch (error) {

            alert(
                "❌ Could not create bill"
            );

            console.error(error);

        }

    }



    // ==========================
    // CLOSE BILL
    // ==========================

    function closeBill() {

        document
            .getElementById(
                "billModal"
            )
            .classList.remove(
                "show"
            );

    }



    // ==========================
    // INITIAL LOAD
    // ==========================

    loadOrders();


    // Auto refresh every 10 seconds

    setInterval(
        loadOrders,
        10000
    );

</script>


</body>

</html>
