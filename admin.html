<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Big Bites — Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #17110c;
    color: #fff3de;
}

header {
    background: #201811;
    border-bottom: 2px solid #f5b301;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo span {
    color: #e8432d;
}

.refresh-btn {
    background: #f5b301;
    color: #241a0c;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

.refresh-btn:hover {
    background: #d99400;
}

.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #cabfa9;
    margin-bottom: 30px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: #201811;
    border: 1px solid rgba(255,243,222,.12);
    padding: 22px;
    border-radius: 8px;
}

.stat-card h3 {
    margin: 0 0 10px;
    color: #cabfa9;
}

.stat-card strong {
    font-size: 32px;
    color: #f5b301;
}

/* ORDERS */

#ordersContainer {
    display: grid;
    gap: 20px;
}

.order-card {
    background: #201811;
    border: 1px solid rgba(255,243,222,.12);
    border-left: 5px solid #f5b301;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.order-id {
    color: #f5b301;
    font-weight: bold;
    margin-bottom: 5px;
}

.order-date {
    color: #cabfa9;
    font-size: 13px;
}

.status {
    padding: 7px 12px;
    border-radius: 20px;
    background: #f5b301;
    color: #241a0c;
    font-weight: bold;
    font-size: 13px;
}

.status-new {
    background: #e8432d;
    color: white;
}

.status-accepted {
    background: #6fae45;
    color: white;
}

.status-preparing {
    background: #f5b301;
    color: #241a0c;
}

.status-delivered {
    background: #4c8fd8;
    color: white;
}

.order-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 20px;
}

.info-box {
    background: #17110c;
    padding: 14px;
    border-radius: 5px;
}

.info-box small {
    display: block;
    color: #cabfa9;
    margin-bottom: 5px;
}

.info-box strong {
    color: #fff3de;
    word-break: break-word;
}

/* TOTAL */

.total-box {
    background: #f5b301;
    color: #241a0c;
    padding: 18px;
    border-radius: 6px;
    margin-top: 10px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 20px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    opacity: .85;
}

.accept {
    background: #6fae45;
    color: white;
}

.preparing {
    background: #f5b301;
    color: #241a0c;
}

.delivered {
    background: #4c8fd8;
    color: white;
}

.bill {
    background: #8c63d9;
    color: white;
}

.delete {
    background: #e8432d;
    color: white;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    background: #201811;
    border-radius: 8px;
    color: #cabfa9;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #f5b301;
}

.error {
    background: #3a1712;
    border: 1px solid #e8432d;
    color: #ff9a8d;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
}

/* BILL */

.bill-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.bill-modal.show {
    display: flex;
}

.bill-box {
    background: white;
    color: #222;
    width: min(500px,100%);
    max-height: 90vh;
    overflow: auto;
    padding: 30px;
    border-radius: 8px;
}

.bill-title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 5px;
}

.bill-subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #666;
}

.bill-line {
    border-top: 1px dashed #999;
    margin: 15px 0;
}

.bill-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin: 10px 0;
}

.bill-total {
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
}

.bill-close {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border: none;
    background: #e8432d;
    color: white;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

.print-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    background: #f5b301;
    color: #241a0c;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

@media print {

    body * {
        visibility: hidden;
    }

    .bill-box,
    .bill-box * {
        visibility: visible;
    }

    .bill-box {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        box-shadow: none;
    }

    .bill-close,
    .print-btn {
        display: none;
    }
}

@media (max-width: 700px) {

    header {
        padding: 16px;
    }

    .logo {
        font-size: 22px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .order-info {
        grid-template-columns: 1fr;
    }

    .container {
        margin-top: 25px;
    }

    .total-box {
        font-size: 17px;
    }
}

</style>

</head>


<body>


<header>

    <div class="logo">

        BIG
        <span>●</span>
        BITES

    </div>


    <button
        class="refresh-btn"
        onclick="loadOrders()">

        🔄 Refresh Orders

    </button>

</header>



<div class="container">


    <h1>
        Order Dashboard
    </h1>


    <p class="subtitle">

        Manage all Big Bites customer orders

    </p>


    <!-- STATS -->

    <div class="stats">


        <div class="stat-card">

            <h3>
                Total Orders
            </h3>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                New Orders
            </h3>

            <strong id="newOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Delivered
            </h3>

            <strong id="deliveredOrders">
                0
            </strong>

        </div>

    </div>


    <div id="ordersContainer">

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>



<!-- BILL MODAL -->

<div
    class="bill-modal"
    id="billModal">

    <div
        class="bill-box"
        id="billContent">

    </div>

</div>



<script>

/*
==================================================
BIG BITES ADMIN DASHBOARD
==================================================
IMPORTANT:

We use relative API URL.

This means:

Website:
https://big-bites-mauve.vercel.app/

API:
https://big-bites-mauve.vercel.app/api/orders

==================================================
*/

const API_URL = "/api/orders";


/*
==================================================
LOAD ORDERS
==================================================
*/

async function loadOrders() {

    const container =
        document.getElementById("ordersContainer");


    container.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;


    try {

        const response =
            await fetch(API_URL, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });


        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const orders =
            await response.json();


        console.log(
            "Orders received:",
            orders
        );


        displayOrders(orders);


    } catch (error) {

        console.error(
            "Load orders error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h3>
                    ❌ Could not load orders
                </h3>

                <p>
                    Make sure the Big Bites backend
                    is deployed and running.
                </p>

                <p>
                    Error:
                    ${escapeHtml(error.message)}
                </p>

                <button
                    class="btn preparing"
                    onclick="loadOrders()">

                    Try Again

                </button>

            </div>

        `;

    }

}


/*
==================================================
DISPLAY ORDERS
==================================================
*/

function displayOrders(orders) {

    const container =
        document.getElementById("ordersContainer");


    updateStats(orders);


    if (!Array.isArray(orders) ||
        orders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    New customer orders will
                    appear here automatically.
                </p>

            </div>

        `;

        return;

    }


    /*
    Newest orders first
    */

    orders.sort(
        (a, b) =>
            Number(b.id || 0) -
            Number(a.id || 0)
    );


    container.innerHTML =
        orders.map(
            order => createOrderCard(order)
        ).join("");

}


/*
==================================================
UPDATE STATISTICS
==================================================
*/

function updateStats(orders) {

    const total =
        Array.isArray(orders)
            ? orders.length
            : 0;


    const newCount =
        Array.isArray(orders)
            ? orders.filter(
                order =>
                    String(order.status)
                    .toLowerCase() === "new"
              ).length
            : 0;


    const deliveredCount =
        Array.isArray(orders)
            ? orders.filter(
                order =>
                    String(order.status)
                    .toLowerCase() === "delivered"
              ).length
            : 0;


    document.getElementById(
        "totalOrders"
    ).textContent = total;


    document.getElementById(
        "newOrders"
    ).textContent = newCount;


    document.getElementById(
        "deliveredOrders"
    ).textContent = deliveredCount;

}


/*
==================================================
CREATE ORDER CARD
==================================================
*/

function createOrderCard(order) {

    const status =
        order.status || "New";


    const statusClass =
        getStatusClass(status);


    return `

        <div class="order-card">

            <div class="order-header">

                <div>

                    <div class="order-id">

                        Order #${escapeHtml(
                            String(order.id || "")
                        )}

                    </div>

                    <div class="order-date">

                        ${escapeHtml(
                            String(order.date || "")
                        )}

                    </div>

                </div>


                <div class="status ${statusClass}">

                    ${escapeHtml(
                        String(status)
                    )}

                </div>

            </div>


            <div class="order-info">


                <div class="info-box">

                    <small>
                        Customer
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(
                                order.customer ||
                                "Unknown"
                            )
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Phone
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(
                                order.phone ||
                                "Not provided"
                            )
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Item
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(
                                order.item ||
                                "Not provided"
                            )
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Quantity
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(
                                order.quantity ||
                                1
                            )
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Price
                    </small>

                    <strong>
                        Rs. ${escapeHtml(
                            String(
                                order.price ||
                                0
                            )
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Address
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(
                                order.address ||
                                "Not provided"
                            )
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Extra Notes
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(
                                order.notes ||
                                "No notes"
                            )
                        )}
                    </strong>

                </div>


            </div>


            <div class="total-box">

                <span>
                    TOTAL
                </span>

                <span>
                    Rs. ${escapeHtml(
                        String(
                            order.total ||
                            0
                        )
                    )}
                </span>

            </div>


            <div class="buttons">


                <button
                    class="btn accept"
                    onclick="updateOrderStatus(
                        '${escapeJs(order.id)}',
                        'Accepted'
                    )">

                    ✓ Accept

                </button>


                <button
                    class="btn preparing"
                    onclick="updateOrderStatus(
                        '${escapeJs(order.id)}',
                        'Preparing'
                    )">

                    🍔 Preparing

                </button>


                <button
                    class="btn delivered"
                    onclick="updateOrderStatus(
                        '${escapeJs(order.id)}',
                        'Delivered'
                    )">

                    ✓ Delivered

                </button>


                <button
                    class="btn bill"
                    onclick='showBill(
                        ${JSON.stringify(order)}
                    )'>

                    🧾 Bill

                </button>


                <button
                    class="btn delete"
                    onclick="deleteOrder(
                        '${escapeJs(order.id)}'
                    )">

                    🗑 Delete

                </button>


            </div>

        </div>

    `;

}


/*
==================================================
STATUS CLASS
==================================================
*/

function getStatusClass(status) {

    const value =
        String(status)
        .toLowerCase();


    if (value === "new") {

        return "status-new";

    }


    if (value === "accepted") {

        return "status-accepted";

    }


    if (value === "preparing") {

        return "status-preparing";

    }


    if (value === "delivered") {

        return "status-delivered";

    }


    return "";

}


/*
==================================================
UPDATE ORDER STATUS
==================================================
*/

async function updateOrderStatus(
    id,
    status
) {

    try {

        const response =
            await fetch(
                `${API_URL}/${encodeURIComponent(id)}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Could not update order"
            );

        }


        alert(
            "Order status updated to " +
            status
        );


        loadOrders();


    } catch (error) {

        console.error(
            "Update status error:",
            error
        );


        alert(
            "❌ Could not update order status.\n\n" +
            error.message
        );

    }

}


/*
==================================================
DELETE ORDER
==================================================
*/

async function deleteOrder(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/${encodeURIComponent(id)}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Could not delete order"
            );

        }


        alert(
            "Order deleted successfully."
        );


        loadOrders();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );


        alert(
            "❌ Could not delete order.\n\n" +
            error.message
        );

    }

}


/*
==================================================
SHOW BILL
==================================================
*/

function showBill(order) {

    const modal =
        document.getElementById(
            "billModal"
        );


    const content =
        document.getElementById(
            "billContent"
        );


    content.innerHTML = `

        <div class="bill-title">
            BIG BITES
        </div>

        <div class="bill-subtitle">
            Customer Order Receipt
        </div>


        <div class="bill-line"></div>


        <div class="bill-row">

            <strong>
                Order ID
            </strong>

            <span>
                #${escapeHtml(
                    String(order.id || "")
                )}
            </span>

        </div>


        <div class="bill-row">

            <strong>
                Customer
            </strong>

            <span>
                ${escapeHtml(
                    String(
                        order.customer ||
                        ""
                    )
                )}
            </span>

        </div>


        <div class="bill-row">

            <strong>
                Phone
            </strong>

            <span>
                ${escapeHtml(
                    String(
                        order.phone ||
                        ""
                    )
                )}
            </span>

        </div>


        <div class="bill-line"></div>


        <div class="bill-row">

            <strong>
                Item
            </strong>

            <span>
                ${escapeHtml(
                    String(
                        order.item ||
                        ""
                    )
                )}
            </span>

        </div>


        <div class="bill-row">

            <strong>
                Quantity
            </strong>

            <span>
                ${escapeHtml(
                    String(
                        order.quantity ||
                        1
                    )
                )}
            </span>

        </div>


        <div class="bill-row">

            <strong>
                Price
            </strong>

            <span>
                Rs. ${escapeHtml(
                    String(
                        order.price ||
                        0
                    )
                )}
            </span>

        </div>


        <div class="bill-line"></div>


        <div class="bill-row bill-total">

            <span>
                TOTAL
            </span>

            <span>
                Rs. ${escapeHtml(
                    String(
                        order.total ||
                        0
                    )
                )}
            </span>

        </div>


        <div class="bill-line"></div>


        <div>

            <strong>
                Delivery Address:
            </strong>

            <p>
                ${escapeHtml(
                    String(
                        order.address ||
                        "Not provided"
                    )
                )}
            </p>

        </div>


        <button
            class="print-btn"
            onclick="window.print()">

            🖨 Print Bill

        </button>


        <button
            class="bill-close"
            onclick="closeBill()">

            Close

        </button>

    `;


    modal.classList.add("show");

}


/*
==================================================
CLOSE BILL
==================================================
*/

function closeBill() {

    document
        .getElementById("billModal")
        .classList.remove("show");

}


/*
==================================================
CLOSE BILL WHEN CLICKING OUTSIDE
==================================================
*/

document
    .getElementById("billModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeBill();

            }

        }
    );


/*
==================================================
SECURITY / HTML ESCAPE
==================================================
*/

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJs(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


/*
==================================================
AUTO LOAD ORDERS
==================================================
*/

loadOrders();


/*
==================================================
AUTO REFRESH EVERY 10 SECONDS
==================================================
*/

setInterval(
    loadOrders,
    10000
);

</script>


</body>

</html>
